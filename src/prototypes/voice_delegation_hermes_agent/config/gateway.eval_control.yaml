# Control of tau3-geval-failure-fixes-plan.md (G2, G4): gateway.eval.yaml with every fix of that plan off,
# so the backend prompts are those of the geval runs (agent 66f6c67). Pair with profiles/realtime_eval_control.yaml.
# The gateway.eval_<fix>.yaml arms extend this file and turn one fix on.

extends: gateway.eval.yaml

prompt_features:
  format_correction: false
  write_consent_v2: false
  policy_check: false
  request_scope: false
  transfer_check: false
  capability_check: false
