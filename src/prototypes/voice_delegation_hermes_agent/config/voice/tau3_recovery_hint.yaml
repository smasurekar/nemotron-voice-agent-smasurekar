#
# voice/tau3_spelling.yaml (M3) plus I3 (tau3-identity-fixes-plan.md section 4.1): after a failed airline
# or retail identity lookup the backend gets a recovery note in the tool result (fix the most doubtful
# field first, one at a time). Telecom lookups are not watched (I1, the backend prompt note, covers them).
# Voice profile of the I3 arm; voice/tau3_fixes.yaml (the default) adds I4.

extends: tau3_spelling.yaml

normalization:
  tool_arguments:
    result_hints:
      enabled: true
      tools: [find_user_id_by_name_zip, find_user_id_by_email, get_user_details]   # retail, airline; not telecom
      failure_pattern: '^Error: .*\bnot found\b'
      count_local_invalid: true       # an incomplete airline user ID answered locally counts as a miss
      max_hints: 3
      message_key: identity_not_found_hint                 # I3: the first miss
      escalate_message_key: ""        # I3 alone: later misses get the same note (tau3_fixes.yaml adds I4)
