#
# tau3-bench voice evaluation profile. Pins every eval-relevant key to its base
# value explicitly, so a later edit to voice_agent.yaml cannot silently change
# eval behaviour. Run tau2 with --max-concurrency 1 until max_sessions is measured.

extends: ../voice_agent.yaml

server:
  # tau2 freezes its tick loop for up to ~90 s at a time (synchronous user-simulator
  # LLM and TTS calls) and stops reading the socket; the agent's streamed audio then
  # fills the client's receive queue, so its pongs stop and a keepalive ping would
  # close a healthy session mid-task. The eval client is local; keepalive is off.
  ws_ping_interval_s: 0

protocol:
  greeting: {enabled: false, text: ""}
  seed_history_with_client_greeting: "Hi! How can I help you today?"
  auto_response: true
  resume_on: response_create

filler:
  mode: log_only

tools:
  source: client

instructions:
  apply_to: [backend]
  placement: policy_slot
  frontend_capabilities: from_tools

barge_in:
  enabled: true
  history: truncate_heard
  interruption_marker: " [interrupted by the user]"
  while_thinking: cancel_and_merge
